<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Eventos Especiais | Paraíso Villas & Spa</title>

  <style>
    :root {
      --terracotta: #a96850;
      --terracotta-dark: #89513e;
      --background: #f8f5f0;
      --text: #403a35;
      --muted: #776e66;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      text-align: center;
      padding: 38px 20px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(27px, 5vw, 38px);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .intro {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.7;
    }

    main {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
      padding: 10px 0 40px;
    }

    #gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .event-card {
      overflow: hidden;
      background: var(--white);
      border: 1px solid #e7ddd5;
      border-radius: 12px;
    }

    .event-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 650px;
      object-fit: contain;
      background: #eee8e1;
    }

    .event-description {
      padding: 16px 20px;
    }

    .event-description h2 {
      margin: 0;
      color: var(--terracotta-dark);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 300;
      overflow-wrap: anywhere;
    }

    .status {
      text-align: center;
      padding: 24px 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 13px 24px;
      border: 1px solid var(--terracotta);
      border-radius: 6px;
      color: var(--terracotta-dark);
      text-decoration: none;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }

    .back-button:hover {
      background: var(--terracotta);
      color: var(--white);
    }

    footer {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Eventos Especiais</h1>
    <p class="intro">
      No Paraíso Villas & Spa, cada ocasião pode tornar-se
      num momento especial. Descubra as nossas propostas
      e inspire-se para o seu próximo evento.
    </p>
  </header>

  <main>
    <section id="gallery">
      <p class="status">A procurar fotografias...</p>
    </section>

    <a class="back-button" href="../index.html">
      Voltar à página inicial
    </a>
  </main>

  <footer>Paraíso Villas & Spa</footer>

  <script>
    const owner = "rececaoparaiso1995-spec";
    const repo = "InfoHotel";
    const folder = "eventos_especiais";
    const gallery = document.getElementById("gallery");

    const imageExtensions = [
      ".jpg", ".jpeg", ".png", ".webp", ".gif"
    ];

    async function loadImages() {
      try {
        const apiUrl =
          `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

        const response = await fetch(apiUrl, {
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error("Não foi possível consultar a pasta.");
        }

        const files = await response.json();

        const images = files
          .filter(file =>
            file.type === "file" &&
            imageExtensions.some(ext =>
              file.name.toLowerCase().endsWith(ext)
            )
          )
          .sort((a, b) =>
            a.name.localeCompare(b.name, "pt",
              { numeric: true, sensitivity: "base" })
          );

        gallery.innerHTML = "";

        if (images.length === 0) {
          gallery.innerHTML = `
            <p class="status">
              Ainda não existem fotografias nesta secção.
              Volte mais tarde para descobrir os nossos eventos.
            </p>
          `;
          return;
        }

        images.forEach(file => {
          const card = document.createElement("article");
          card.className = "event-card";

          const img = document.createElement("img");
          img.src = file.download_url;
          img.alt = file.name.replace(/\.[^.]+$/, "")
            .replace(/[_-]+/g, " ");
          img.loading = "lazy";

          const description = document.createElement("div");
          description.className = "event-description";

          const title = document.createElement("h2");
          title.textContent = file.name
            .replace(/\.[^.]+$/, "")
            .replace(/[_-]+/g, " ");

          description.appendChild(title);
          card.appendChild(img);
          card.appendChild(description);
          gallery.appendChild(card);
        });

      } catch (error) {
        gallery.innerHTML = `
          <p class="status">
            Não foi possível carregar as fotografias.
            Verifique a ligação à Internet e tente novamente.
          </p>
        `;
      }
    }

    loadImages();
  </script>
</body>
</html>
