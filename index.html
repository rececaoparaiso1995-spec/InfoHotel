<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>Informações | Paraíso Villas &amp; Spa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(23px, 5vw, 32px);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0;
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }

    .languages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .language-button {
      min-height: 64px;
      padding: 14px 10px;
      border: 1px solid #d8d1c5;
      border-radius: 10px;
      background: #fff;
      color: #333;
      font-size: 16px;
      cursor: pointer;
    }

    .language-button:hover,
    .language-button:focus-visible {
      background: #eee8dc;
      border-color: #a99a80;
      outline: none;
    }

    .flag {
      display: block;
      margin-bottom: 6px;
      font-size: 25px;
    }

    .image-section {
      display: none;
    }

    .image-section.visible {
      display: block;
    }

    .info-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 20px;
      border-radius: 4px;
    }

    .back-button {
      display: block;
      min-height: 44px;
      margin: 24px auto 0;
      padding: 12px 20px;
      border: 1px solid #d8d1c5;
      border-radius: 8px;
      background: #fff;
      color: #333;
      font-size: 15px;
      cursor: pointer;
    }

    .back-button:hover,
    .back-button:focus-visible {
      background: #eee8dc;
    }

    .error-message {
      display: none;
      margin: 12px 0 20px;
      color: #9b2525;
      line-height: 1.5;
    }

    .error-message.visible {
      display: block;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 360px) {
      body {
        padding: 20px 12px;
      }

      .languages {
        gap: 8px;
      }

      .language-button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>Paraíso Villas &amp; Spa</h1>
      <p id="subtitle">Selecione o seu idioma</p>
    </header>

    <section id="language-menu" class="languages"
             aria-label="Seleção de idioma">

      <button class="language-button" type="button"
              data-lang="pt">
        <span class="flag" aria-hidden="true">🇵🇹</span>
        Português
      </button>

      <button class="language-button" type="button"
              data-lang="en">
        <span class="flag" aria-hidden="true">🇬🇧</span>
        English
      </button>

      <button class="language-button" type="button"
              data-lang="fr">
        <span class="flag" aria-hidden="true">🇫🇷</span>
        Français
      </button>

      <button class="language-button" type="button"
              data-lang="es">
        <span class="flag" aria-hidden="true">🇪🇸</span>
        Español
      </button>
    </section>

    <section id="image-section" class="image-section"
             aria-live="polite">

      <img id="hotel-image" class="info-image"
           src="" alt="Informações do hotel">

      <p id="hotel-error" class="error-message">
        Não foi possível carregar a imagem do hotel.
        Confirme o nome do ficheiro.
      </p>

      <img id="restaurant-image" class="info-image"
           src="" alt="Informações do restaurante">

      <p id="restaurant-error" class="error-message">
        Não foi possível carregar a imagem do restaurante.
        Confirme o nome do ficheiro.
      </p>

      <button id="back-button" class="back-button" type="button">
        ← Escolher outro idioma
      </button>
    </section>

    <footer>
      Paraíso Villas &amp; Spa
    </footer>
  </main>

  <script>
    const languages = {
      pt: {
        subtitle: "Informações para hóspedes",
        hotel: "info.png",
        restaurant: "infoRest.png",
        back: "← Escolher outro idioma",
        hotelAlt: "Informações do hotel em português",
        restaurantAlt: "Informações do restaurante em português"
      },
      en: {
        subtitle: "Guest information",
        hotel: "info-en.png",
        restaurant: "infoRest-en.png",
        back: "← Choose another language",
        hotelAlt: "Hotel information in English",
        restaurantAlt: "Restaurant information in English"
      },
      fr: {
        subtitle: "Informations pour les clients",
        hotel: "info-fr.png",
        restaurant: "infoRest-fr.png",
        back: "← Choisir une autre langue",
        hotelAlt: "Informations de l'hôtel en français",
        restaurantAlt: "Informations du restaurant en français"
      },
      es: {
        subtitle: "Información para huéspedes",
        hotel: "info-es.png",
        restaurant: "infoRest-es.png",
        back: "← Elegir otro idioma",
        hotelAlt: "Información del hotel en español",
        restaurantAlt: "Información del restaurante en español"
      }
    };

    const menu = document.getElementById("language-menu");
    const imageSection = document.getElementById("image-section");
    const subtitle = document.getElementById("subtitle");
    const backButton = document.getElementById("back-button");

    const hotelImage = document.getElementById("hotel-image");
    const restaurantImage = document.getElementById("restaurant-image");
    const hotelError = document.getElementById("hotel-error");
    const restaurantError = document.getElementById("restaurant-error");

    function showLanguage(code) {
      const language = languages[code];
      if (!language) return;

      menu.style.display = "none";
      imageSection.classList.add("visible");

      subtitle.textContent = language.subtitle;
      backButton.textContent = language.back;

      hotelError.classList.remove("visible");
      restaurantError.classList.remove("visible");

      hotelImage.alt = language.hotelAlt;
      restaurantImage.alt = language.restaurantAlt;

      hotelImage.src = language.hotel;
      restaurantImage.src = language.restaurant;
    }

    function showMenu() {
      imageSection.classList.remove("visible");
      menu.style.display = "grid";
      subtitle.textContent = "Selecione o seu idioma";
    }

    document.querySelectorAll(".language-button").forEach(button => {
      button.addEventListener("click", () => {
        showLanguage(button.dataset.lang);
      });
    });

    backButton.addEventListener("click", showMenu);

    hotelImage.addEventListener("error", () => {
      hotelError.classList.add("visible");
    });

    restaurantImage.addEventListener("error", () => {
      restaurantError.classList.add("visible");
    });
  </script>
</body>
</html>
