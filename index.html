<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee2">
  <title>Paraíso Villas & Spa - Informações</title>

  <style>
    :root {
      --cream: #f4eee2;
      --terracotta: #ad704d;
      --terracotta-hover: #965d3e;
      --text: #252321;
      --brown: #392719;
      --muted: #76533b;
      --line: #d3b79c;
      --white: #fffaf5;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 0 22px 38px;
      background: var(--cream);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    button, input { font: inherit; }
    a { color: inherit; }

    .language-page,
    #information,
    .help-card {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .language-page {
      max-width: 900px;
      padding-top: 36px;
    }

    .brand-logo {
      display: block;
      width: min(100%, 440px);
      height: auto;
      margin: 0 auto;
      mix-blend-mode: multiply;
    }

    .intro {
      margin: 48px auto 0;
      color: var(--brown);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(19px, 2.7vw, 25px);
      line-height: 1.55;
    }

    .intro p { margin: 0; }

    .intro p + p {
      margin-top: 3px;
      color: var(--muted);
      font-size: .82em;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin: 24px auto 0;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      width: 48px;
      height: 1px;
      background: var(--line);
    }

    .ornament span {
      color: var(--terracotta);
      font-size: 14px;
    }

    .languages {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      max-width: 720px;
      margin: 42px auto 0;
    }

    .language-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 148px;
      padding: 24px 14px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: rgba(255, 250, 245, .68);
      color: var(--brown);
      font-size: clamp(21px, 3vw, 29px);
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 5px 18px rgb(57 39 25 / 4%);
      transition: background-color .18s ease, color .18s ease,
        border-color .18s ease, transform .18s ease;
    }

    .language-button:hover {
      background: var(--terracotta);
      border-color: var(--terracotta);
      color: var(--white);
      transform: translateY(-2px);
    }

    .events-button {
      grid-column: 1 / -1;
      flex-direction: row;
      gap: 13px;
      min-height: 68px;
      padding: 18px 20px;
      background: var(--terracotta);
      border-color: var(--terracotta);
      color: var(--white);
      font-size: 18px;
    }

    .events-button:hover {
      background: var(--terracotta-hover);
      border-color: var(--terracotta-hover);
    }

    .flag {
      font-size: 1.45em;
      line-height: 1;
    }

    .language-button:focus-visible,
    .back-button:focus-visible,
    .help-button:focus-visible,
    .download-link:focus-visible,
    .help-input:focus-visible {
      outline
